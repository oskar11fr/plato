[package]
name = "plato"
version = "0.1.0"
description = "Research reader and notes"
authors = ["Oskar Fransson"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "plato_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "form", "query"] }
tokio = { version = "1", features = ["macros", "time", "sync", "net", "io-util", "rt"] }
tokio-util = "0.7"
futures-util = "0.3"
async-trait = "0.1"
thiserror = "2.0.21"
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto"] }
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.3"
uuid = { version = "1", features = ["v4"] }
trash = "5"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
